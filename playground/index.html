<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR1 Studio</title><link href="https://googleapis.com" rel="stylesheet">
<style>
  :root{--bg:#060913;--panel:#0f172a;--border:#1e293b;--cyan:#00f2fe;--blue:#4facfe;--green:#00e676}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:#f8fafc;font-family:"Cairo",sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{background:rgba(15,23,42,.95);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:6px;flex-wrap:wrap}
  .logo{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#060913;font-weight:900;padding:3px 10px;border-radius:8px;font-family:"Fira Code",monospace;box-shadow:0 0 12px rgba(0,242,254,.4)}
  .tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  button,select{padding:6px 10px;border:none;border-radius:8px;font-family:"Cairo";font-weight:800;font-size:.78rem;cursor:pointer;transition:.2s}
  select{background:#1e293b;color:var(--cyan);border:1px solid #334155}
  .vbtn{background:#1e293b;color:#94a3b8;padding:6px 9px} .vbtn.on{background:var(--blue);color:#060913}
  .tabs{display:flex;background:#0b1120;border-bottom:1px solid var(--border)}
  .tab{flex:1;padding:9px 4px;text-align:center;font-size:.82rem;font-weight:800;color:#64748b;cursor:pointer;border-bottom:3px solid transparent}
  .tab.active{color:var(--cyan);background:var(--panel);border-color:var(--cyan)}
  .syms{display:flex;background:#090d16;padding:5px;gap:5px;direction:ltr;overflow-x:auto;border-bottom:1px solid var(--border)}
  .sym{background:#1e293b;color:#38bdf8;padding:5px 12px;border-radius:6px;font-family:"Fira Code",monospace;font-size:.95rem;flex-shrink:0}
  .work{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  @media(min-width:820px){.work{flex-direction:row}}
  .ed{flex:1;display:flex;flex-direction:column;min-height:0;border-bottom:2px solid var(--border)}
  @media(min-width:820px){.ed{border-bottom:none;border-left:2px solid var(--border)}}
  textarea{flex:1;width:100%;background:#070b14;color:#e2e8f0;border:none;padding:14px;font-family:"Fira Code",monospace;font-size:14px;direction:ltr;text-align:left;outline:none;resize:none;display:none;line-height:1.6}
  textarea.active{display:block}
  iframe,#pyOut{flex:1;width:100%;min-height:0;border:none;background:#fff}
  #pyOut{display:none;background:#05080f;color:var(--green);padding:14px;font-family:"Fira Code",monospace;direction:ltr;text-align:left;white-space:pre-wrap;overflow:auto;font-size:14px}
  .hide{display:none!important}
</style></head><body><header><div style="display:flex;align-items:center;gap:8px"><span class="logo">MR1</span><b>Code Studio</b></div><div style="display:flex;gap:6px"><select onchange="tpl(this.value)"><option value="">قوالب...</option><option value="c">آلة حاسبة</option><option value="p">خاسورد بايثون</option><option value="sec">🛡️ فحص أمان المواقع</option></select><button class="vbtn on" id="v0" onclick="vm(0)" title="تقسيم">◫</button><button class="vbtn" id="v1" onclick="vm(1)" title="كود فقط">⌨️</button><button class="vbtn" id="v2" onclick="vm(2)" title="معاينة فقط">👁️</button><button style="background:#00e676;color:#000" onclick="runAll()">▶ Run</button><button style="background:#00f2fe;color:#000" onclick="dl()">💾Lev</button></div></header><div class="work"><div class="ed"><div class="tabs"><div class="tab active" onclick="st(0)">HTML</div><div class="tab" onclick="st(1)">CSS</div><div class="tab" onclick="st(2)">JS</div><div class="tab" onclick="st(3)" style="color:#00e676">Python</div></div><div class="syms"><button class="sym" onclick="ins('<')">&lt;</button><button class="sym" onclick="ins('>',)">&gt;</button><button class="sym" onclick="ins('/')">/</button><button class="sym" onclick="ins('{')">{</button><button class="sym" onclick="ins('}')">}</button><button class="sym" onclick="ins('(')">(</button><button class="sym" onclick="ins(')')">)</button><button class="sym" onclick="ins(';')">;</button><button class="sym" onclick="ins('=')">=</button></div><textarea id="t0" class="active" oninput="rw()"><div class="box"><h2>MR1 Studio ⚡</h2><p>المعاينة شغاله 200%</p><button onclick="hi()">جرب</button></div></textarea><textarea id="t1" oninput="rw()">body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;text-align:center}.box{background:#1e293b;padding:25px;border-radius:15px;border:2px solid #00f2fe}button{background:#00f2fe;border:none;padding:8px 18px;border-radius:7px;font-weight:bold;margin-top:10px}</textarea><textarea id="t2" oninput="rw()">function hi(){alert("MR1 شغال بنجاح 🔥")}</textarea><textarea id="t3">import datetime
print("MR1 Python Ready!")
print("Time:", datetime.datetime.now())</textarea></div><iframe id="pv"></iframe><div id="pyOut">اضقط ▶ Run لتشييل بايثون...</div></div><script>
let c=0;function vm(m){[0,1,2].forEach(x=>document.getElementById("v"+x).classList.toggle("on",x==m));let ed=document.querySelector(".ed"),out=c==3?pyOut:pv;ed.classList.toggle("hide",m==2);out.classList.toggle("hide",m==1)}
function st(i){c=i;document.querySelectorAll(".tab").forEach((t,x)=>t.classList.toggle("active",x==i));document.querySelectorAll("textarea").forEach((a,x)=>a.classList.toggle("active",x==i));pv.style.display=i==3?"none":"block";pyOut.style.display=i==3?"block":"none";if(i!=3)rw()}
function rw(){pv.srcdoc="<!DOCTYPE html><html dir=rtl><head><meta charset=UTF-8><style>"+t1.value+"</style></head><body>"+t0.value+"<script>"+t2.value+"<\/script></body></html>"}
async function rp(){pyOut.innerText="⏳ جاري التشغيل...";let r=await fetch("/run-py",{method:"POST",body:JSON.stringify({code:t3.value})});let d=await r.json();pyOut.innerText=d.output}
function runAll(){c==3?rp():rw()}
function ins(x){let a=document.getElementById("t"+c),s=a.selectionStart;a.value=a.value.slice(0,s)+x+a.value.slice(a.selectionEnd);a.selectionStart=a.selectionEnd=s+1;a.focus();if(c!=3)rw()}
function tpl(v){if(v=="c"){t0.value="<input id=a type=number> + <input id=b type=number> <button onclick=r.innerText=+a.value+ +b.value>=</button><h2 id=r></h2>";t1.value="body{background:#0f172a;color:#fff;padding:30px;text-align:center}input{width:60px;padding:5px}";t2.value="";st(0)}else if(v=="sec"){let u=prompt("اكتب رابط الموقع للفحص (بدون https):","github.com");if(u){t3.value=`import socket, ssl\nfrom datetime import datetime\nsite = "__SITE__"\nprint(f"🛡️ === MR1 SECURITY SCAN: {site} === 🛡️\\n")\ntry:\n ctx = ssl.create_default_context()\n with ctx.wrap_socket(socket.socket(), server_hostname=site) as s:\n  s.settimeout(4); s.connect((site, 443))\n  cert = s.getpeercert()\n  iss = dict(x[0] for x in cert["issuer"]).get("organizationName", "Unknown")\n  exp = datetime.strptime(cert["notAfter"], "%b %d %H:%M:%S %Y %Z")\n  days = (exp - datetime.utcnow()).days\n  print(f"🔒 الشهادة (SSL): {iss} | متبقي {days} يوم")\n  s.send(f"HEAD / HTTP/1.1\\r\\nHost: {site}\\r\\nConnection: close\\r\\n\\r\\n".encode())\n  h = s.recv(2048).decode(errors="ignore").lower()\n  for k, n in {"strict-transport-security":"HSTS (HTTPS إجباري)", "x-frame-options":"Clickjacking حماية", "content-security-policy":"XSS حماية"}.items():\n   print(f"  {'✔ محمي' if k in h else '❌ مكشوف'} | {n}")\nexcept Exception as e:\n print("❌ خطأ في الفحص:", e)`.replace("__SITE__",u.trim());st(3);rp()}}else if(v=="p"){t3.value="import secrets,string\nprint(\"\".join(secrets.choice(string.ascii_letters+string.digits+\"!@#\")for _ in range(16)))";st(3);rp()}}
function dl(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["<!DOCTYPE html><html><head><meta charset=UTF-8><style>"+t1.value+"</style></head><body>"+t0.value+"<script>"+t2.value+"<\/script></body></html>"],{type:"text/html"}));a.download="MR1.html";a.click()}
rw()
</script></body></html>
